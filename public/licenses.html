<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ferrion-gateway – Open Source Licenses</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="shared.css" />
  </head>
  <body>
    <div class="top-bar">
      <a class="back-link md-label-large" href="index.html">
        <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
        <span data-i18n="backToOverview"></span>
      </a>
      <div class="lang-switch" id="lang-switch" role="group" aria-label="Language / Sprache">
        <button type="button" data-locale="de">Deutsch</button>
        <button type="button" data-locale="en">English</button>
      </div>
    </div>

    <div class="page page--wide">
      <h1 class="md-headline-small" data-i18n="licensesTab"></h1>
      <p class="md-body-medium" data-i18n="licensesIntro" style="color: var(--md-on-surface-variant)"></p>
      <div class="licenses-table-scroll">
        <table class="licenses-table md-body-medium">
          <thead>
            <tr>
              <th class="md-title-small" data-i18n="licensesNameColumn"></th>
              <th class="md-title-small" data-i18n="licensesVersionColumn"></th>
              <th class="md-title-small" data-i18n="licensesLicenseColumn"></th>
            </tr>
          </thead>
          <tbody id="licenses-body"></tbody>
        </table>
      </div>
    </div>

    <script type="module" src="licenses-page.js"></script>
